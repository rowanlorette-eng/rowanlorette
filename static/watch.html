<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="watch.css">
</head>
<body>
  <div class="topbar">
    <a href="index.html">Home</a>
    <a href="upload.html">Upload</a>
  </div>

  <div class="layout">
    <div class="player">
      <div class="video-wrapper" id="videoWrapper">
        <video id="player"></video>

        <!-- overlay -->
        <div class="overlay" id="overlay">
          <button id="bigPlay" class="bigPlay">▶</button>
        </div>

        <!-- controls -->
        <div class="controls" id="controls">
          <div class="controls-left">
            <button id="playPause" class="control-btn">▶</button>

            <div class="volume-wrap">
              <button id="muteBtn" class="control-btn sound-btn">🔊</button>
              <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="1">
            </div>

            <span id="time" class="time">00:00 / 00:00</span>
          </div>

          <div class="controls-right">
            <button id="fullscreen" class="control-btn">⛶</button>
          </div>
        </div>

        <input id="seek" class="seek" type="range" min="0" max="100" value="0">
        <div class="buffer" id="buffer"></div>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="list" id="list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="watch.js"></script>
</body>
</html>
