<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umbrella Play</title>
    <link rel="stylesheet" href="watch.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Umbrella</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="upload.html">Upload</a>
          <a href="/watch">Watch</a>
        </div>
      </nav>
    </header>

    <div class="layout">
      <div class="player">
        <div class="video-wrapper" id="videoWrapper">
          <!-- video -->
          <video id="player"></video>

          <!-- overlay -->
          <div class="overlay" id="overlay">
            <button id="bigPlay" class="bigPlay">▶</button>
          </div>

          <!-- controls -->
          <div class="controls" id="controls">
            <div class="controls-left">
              <button id="playPause" class="control-btn">▶</button>

              <div class="volume-wrap">
                <button id="muteBtn" class="control-btn sound-btn">
                  <img
                    id="volumeIcon"
                    src="/icons/volume.png"
                    class="icon-btn"
                    alt="volume"
                  />
                </button>

                <input
                  id="volume"
                  class="volume"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value="1"
                />
              </div>

              <span id="time" class="time">00:00 / 00:00</span>
            </div>

            <div class="controls-right">
              <button id="settingsBtn" class="control-btn">
                <img
                  src="/icons/settings.svg"
                  class="icon-btn"
                  alt="settings"
                />
              </button>
              <button id="fullscreen" class="control-btn">⛶</button>
            </div>
          </div>

          <!-- settings menu -->
          <div class="settings-menu" id="settingsMenu">
            <div class="settings-item" id="qualityBtn">
              <img src="/icons/equalizer.png" class="icon-btn" alt="settings" />
              <span>Качество</span>
              <span class="arrow">›</span>
            </div>

            <div class="settings-submenu" id="qualityMenu">
              <div class="settings-item active" data-quality="auto">
                Максимальное
              </div>
              <div class="settings-item" data-quality="audio">Только звук</div>
            </div>
          </div>

          <!-- seek + buffer -->
          <input
            id="seek"
            class="seek"
            type="range"
            min="0"
            max="100"
            value="0"
          />
          <div class="buffer" id="buffer"></div>
        </div>

        <!-- audio-only player -->
        <section class="music" id="audioWrapper" style="display: none">
          <h1>Audio Mode</h1>
          <div class="audio-player">
            <div class="audio-info">
              <div class="audio-title" id="audioTitle">Audio Stream</div>
              <div class="audio-time">
                <span class="current-time">00:00</span> /
                <span class="duration">00:00</span>
              </div>
            </div>

            <div class="audio-controls">
              <button class="rewind audio-btn">⏪</button>
              <button class="play-pause audio-btn">▶️</button>
              <button class="forward audio-btn">⏩</button>
              <button id="audioSettingsBtn" class="control-btn">
                <img
                  src="/icons/settings.svg"
                  class="icon-btn"
                  alt="settings"
                />
              </button>
            </div>

            <div class="progress-bar">
              <input
                type="range"
                class="progress"
                value="0"
                min="0"
                max="100"
              />
            </div>

            <audio class="audio" id="audioPlayer"></audio>
          </div>
        </section>

        <div id="status" class="status"></div>
      </div>

      <div class="list" id="list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="watch.js"></script>
  </body>
</html>
